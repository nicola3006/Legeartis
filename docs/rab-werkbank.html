<title>RAB Werkbank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: schmale Rail links, Arbeitsfläche auf warmem Weiss mit Haarlinien, Quellenpanel rechts. Tabellarische Prüfung, suchzentriertes Wissen, Dokument im Zentrum. */
:root{
  --bg:#f7f6f3; --panel:#ffffff; --panel2:#f0eee9; --line:#e5e2db; --line2:#d6d2c9; --fg:#161615; --muted:#6f6e68; --faint:#a3a29b;
  --accent:#1f5a3c; --accent-soft:#e4efe8; --hl:#fff1a8; --hl-fg:#2a2300;
  --ok:#1f7a4a; --warn:#b4751d; --crit:#b3261e;
  --ok-soft:#e2f1e8; --warn-soft:#f7ead3; --crit-soft:#f8dedb; --info-soft:#e8ecf3; --info:#38547a;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rs:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1a1a19; --panel2:#222220; --line:#2b2b29; --line2:#3a3a37; --fg:#ecebe6; --muted:#a09f98; --faint:#6e6d67;
    --accent:#86c9a3; --accent-soft:#1c2e24; --hl:#4a3f10; --hl-fg:#fff1a8;
    --ok:#7ccf9c; --warn:#e2a95a; --crit:#ef8b84;
    --ok-soft:#182a1f; --warn-soft:#352813; --crit-soft:#3b1d1a; --info-soft:#1f2733; --info:#9fb6d6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1a1a19; --panel2:#222220; --line:#2b2b29; --line2:#3a3a37; --fg:#ecebe6; --muted:#a09f98; --faint:#6e6d67;
  --accent:#86c9a3; --accent-soft:#1c2e24; --hl:#4a3f10; --hl-fg:#fff1a8;
  --ok:#7ccf9c; --warn:#e2a95a; --crit:#ef8b84;
  --ok-soft:#182a1f; --warn-soft:#352813; --crit-soft:#3b1d1a; --info-soft:#1f2733; --info:#9fb6d6; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--font);padding-inline:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.15}
h1{font-family:var(--serif);font-size:34px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:24px}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:72px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);min-height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;height:52px;padding:0 18px 0 0;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .logo{width:72px;height:52px;display:grid;place-items:center;border-right:1px solid var(--line)}
.top .logo b{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:.02em}
.top .crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);min-width:0}
.top .crumbs b{color:var(--fg);font-weight:500}
.top .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;min-width:300px;color:var(--muted);font-size:13px}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--faint)}
.klasse{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.klasse .dot{width:8px;height:8px;border-radius:50%}
.k0 .dot{background:var(--ok)}.k1 .dot{background:var(--info)}.k2 .dot{background:var(--warn)}.k3 .dot{background:var(--crit)}
.top .av{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:600}
.proto{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:3px 8px;border-radius:999px}

.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:10px 8px;gap:2px;background:var(--bg)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:var(--rs);font-size:10.5px;font-weight:500;color:var(--muted)}
.rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--panel2);color:var(--fg)}
.rail button.active{background:var(--fg);color:var(--bg)}
.rail .sp{flex:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{padding:28px 32px 56px;min-width:0;display:flex;flex-direction:column;gap:22px}
.hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hd .grow{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.hd p{color:var(--muted);max-width:72ch}
.hd .actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line2);background:var(--panel);padding:7px 12px;border-radius:999px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.dark:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.block.bare{background:transparent;border:0;padding:0}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bh h3{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:118px}
.mcard:hover{border-color:var(--line2)}
.mcard .ti{font-family:var(--serif);font-size:20px;line-height:1.1}
.mcard .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mcard .prog{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:auto}
.mcard .prog i{display:block;height:100%;background:var(--fg)}
.mcard.crit .prog i{background:var(--crit)}.mcard.warn .prog i{background:var(--warn)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.quiet{color:var(--muted)}
.ref{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:500;cursor:pointer;vertical-align:middle;border:1px solid transparent}
.ref:hover,.ref.on{border-color:var(--fg);color:var(--fg)}
.ref.k3{background:var(--crit-soft);color:var(--crit)}
.ref.k0{background:var(--ok-soft);color:var(--ok)}

/* Tabular review */
.tr{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.tr .tb{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tr .tb h3{flex:1}
.tr .wrap{overflow-x:auto}
.tr table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:12.5px}
.tr th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.tr th .q{display:block;color:var(--fg);font-weight:500;font-size:12.5px;white-space:normal;max-width:190px}
.tr th .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tr th:first-child,.tr td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:200px}
.tr td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;min-width:150px}
.tr tr:last-child td{border-bottom:0}
.tr th:last-child,.tr td:last-child{border-right:0}
.cell{padding:9px 12px;min-height:52px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.cell:hover{background:var(--panel2)}
.cell.sel{background:var(--accent-soft)}
.cell .v{font-weight:500}
.cell .s{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cell.pending .v{color:var(--muted);font-style:italic}
.cell.rowh{cursor:default;gap:2px}
.cell.rowh:hover{background:var(--panel)}
.cell.rowh b{font-weight:500}
.cell.rowh small{color:var(--muted);font-family:var(--mono);font-size:11px}
.addcol{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.addcol input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:999px;background:var(--panel);padding:7px 12px}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.cell.pending .v{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cell.pending .v{animation:none}}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .d{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.item .t{font-size:13.5px}
.item .m{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .r{grid-row:1/3;display:flex;gap:6px;align-items:center}

/* Wissen (Suche) */
.ksearch{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:12px 16px;font-size:16px}
.ksearch input{flex:1;min-width:0;border:0;background:transparent;font-size:16px}
.ksearch input::placeholder{color:var(--faint)}
.klayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}
.facets{display:flex;flex-direction:column;gap:16px}
.facet h4{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.facet label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.facet label .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.res{display:flex;flex-direction:column;gap:0}
.hit{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.hit:hover .ht{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.hit .ht{font-family:var(--serif);font-size:19px}
.hit .hm{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hit .hp{font-size:13.5px;max-width:78ch;line-height:1.55}
.hit mark,.pass mark{background:var(--hl);color:var(--hl-fg);padding:0 2px;border-radius:2px}
.hit .why{font-size:12px;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px}

/* Dokument */
.doclayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}
.outline{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px;align-self:start}
.outline button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);text-align:left;font-size:13px;width:100%}
.outline button:hover{background:var(--panel2)}
.outline button.active{background:var(--panel);border:1px solid var(--line)}
.outline .st{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.outline .st.ok{background:var(--ok)}.outline .st.warn{background:var(--warn)}.outline .st.crit{background:var(--crit)}
.outline .sec{margin-top:10px}
.docsheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:48px 56px;max-width:760px;font-family:var(--serif);font-size:16px;line-height:1.6}
.docsheet .lh{display:flex;justify-content:space-between;font-family:var(--font);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px}
.docsheet .lh b{display:block;color:var(--fg);font-weight:500;font-size:12px}
.docsheet h1{font-size:26px;margin-bottom:4px}
.docsheet .sub{font-family:var(--font);font-size:13px;color:var(--muted);margin-bottom:24px}
.docsheet h2{font-size:18px;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.docsheet h2 .chip{font-family:var(--font)}
.docsheet p{margin:0 0 10px}
.docsheet .e{display:grid;grid-template-columns:36px 1fr;gap:8px;margin-bottom:10px}
.docsheet .e span{font-weight:400}
.docsheet .ph{background:var(--hl);color:var(--hl-fg);padding:0 4px;border-radius:3px;font-family:var(--font);font-size:12.5px}
.docsheet .ref{font-family:var(--mono);font-size:10px;transform:translateY(-4px)}
.docsheet .disp{border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;margin-top:12px}
.docsheet .disp ol{margin:6px 0 0;padding-left:20px}
.docsheet .sig{margin-top:30px;display:flex;justify-content:space-between;font-family:var(--font);font-size:12px;color:var(--muted)}
.docsheet .fn{font-family:var(--font);font-size:10.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:8px}
.docsheet p.edit{position:relative}
.docsheet .sec{border-radius:var(--rs);padding:2px 6px;margin:0 -6px}
.docsheet .sec.focus{background:var(--panel2)}

/* Timeline & facts */
.facts{display:flex;flex-direction:column}
.fact{display:grid;grid-template-columns:92px 1fr auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.fact:last-child{border-bottom:0}
.fact .d{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.fact .src{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fact .st{grid-row:1/3;display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.fact.ki{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:var(--rs);border-bottom:0}
.fact.derived .t{font-style:italic;color:var(--muted)}
.fform{display:grid;grid-template-columns:140px 1fr 160px auto;gap:8px;margin-top:12px}
.fform input{border:1px solid var(--line2);border-radius:var(--rs);background:var(--panel);padding:7px 10px;min-width:0}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.vgrid .vcol{display:flex;flex-direction:column}
.vrow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.vrow .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow select{border:1px solid var(--line2);background:var(--panel);border-radius:var(--rs);padding:3px 6px;font-size:12px}
.vrow q{font-family:var(--serif);font-size:15.5px;quotes:"«" "»"}

/* Readiness */
.ready{display:flex;flex-direction:column;gap:8px}
.ready .top2{display:flex;align-items:baseline;gap:10px}
.ready .top2 b{font-family:var(--serif);font-size:30px;font-weight:400}
.ready ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.ready li{display:flex;gap:8px;align-items:flex-start}
.ready li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--crit);flex:none;margin-top:6px}
.ready li.ok:before{background:var(--ok)}.ready li.warn:before{background:var(--warn)}

/* Assistant / sources */
.aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.aside .ah{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.aside .ah .tabs2{display:flex;gap:2px;background:var(--panel2);border-radius:999px;padding:2px}
.aside .ah .tabs2 button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--muted)}
.aside .ah .tabs2 button.active{background:var(--panel);color:var(--fg)}
.aside .body{padding:16px 18px;display:flex;flex-direction:column;gap:16px;overflow:auto;flex:1}
.amsg{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.55}
.amsg .who{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.amsg.user{padding:10px 12px;background:var(--panel2);border-radius:var(--r)}
.srcs{display:flex;flex-direction:column;gap:6px}
.src{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--rs);background:var(--panel);font-size:12px;cursor:pointer}
.src:hover{border-color:var(--line2)}
.src .t{font-weight:500}
.src .p{color:var(--muted);font-size:11.5px}
.src .pass{margin-top:4px;font-family:var(--serif);font-size:13.5px;line-height:1.45}
.src.k3{border-left:3px solid var(--crit)}.src.k0{border-left:3px solid var(--ok)}.src.k1{border-left:3px solid var(--info)}
.nocite{font-size:12px;color:var(--crit);border:1px dashed var(--crit);padding:6px 10px;border-radius:var(--rs)}
.gate{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;background:var(--panel)}
.gate label{display:flex;gap:8px;align-items:flex-start}
.gate input{margin-top:3px}
.aside .foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:column;gap:8px}
.compose{display:flex;gap:6px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);padding:4px 4px 4px 14px}
.compose input{flex:1;min-width:0;border:0;background:transparent}
.compose button{background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500}
.srcview{display:flex;flex-direction:column;gap:10px}
.srcview .doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;font-family:var(--serif);font-size:14px;line-height:1.55}
.srcview .doc .lbl{font-family:var(--font);font-size:11px;color:var(--muted);margin-bottom:6px}

.redact .r{background:var(--fg);color:var(--fg);border-radius:2px;padding:0 2px}
.redact.show .r{background:var(--crit-soft);color:var(--crit);text-decoration:line-through}
.redact .n{background:var(--ok-soft);color:var(--ok);border-radius:2px;padding:0 3px;font-family:var(--mono);font-size:12px}
.log{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:28px 30px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:30px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.legend div{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;font-size:12.5px}
.legend div b{display:block;font-weight:600}
.palette{position:fixed;inset:0;background:rgba(20,20,18,.4);z-index:25;display:grid;place-items:start center;padding-top:14vh}
.palette .pw{width:min(620px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:16px}
.palette .items{max-height:50vh;overflow:auto;padding:6px}
.palette .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--rs);cursor:pointer;font-size:13.5px}
.palette .it:hover,.palette .it.act{background:var(--panel2)}
.palette .it .mono{margin-left:auto;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.form2{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.form2 select{border:1px solid var(--line2);border-radius:var(--rs);background:var(--panel);padding:7px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

@media (max-width:1200px){.shell{grid-template-columns:72px minmax(0,1fr)}.aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.search{min-width:0}}
@media (max-width:900px){.doclayout,.klayout,.vgrid{grid-template-columns:1fr}.outline{position:static}.fform{grid-template-columns:1fr}.docsheet{padding:28px 22px}}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top{height:auto;padding:8px 16px;flex-wrap:wrap}.top .logo{width:auto;border:0;height:auto}.search,.top .av{display:none}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.rail .sp{display:none}.rail button{flex:none;padding:8px 10px}
  .main{padding:18px 16px 36px}h1{font-size:28px}
}

function gate(g){
  const w=el('<div class="gate"><b>Freigabe durch dich</b></div>');

  const all=g.items.every((_,i)=>S.gate[g.id+'_'+i]);
  const btn=el(`<button class="btn dark sm" ${all?'':'disabled'}>${g.label}</button>`);
  btn.addEventListener('click',()=>{log(g.logmsg);toast(g.done);aiMsg(g.after,[],{tag:'erledigt',tagc:'ok'})});
  w.appendChild(btn);return w;
}
function checks(){
  const f=S.f,unbelegt=f.chrono.filter(e=>!e.src||(e.ki&&e.st==='bestritten'&&!e.conf)).length,beantw=f.vorbringen.filter(v=>v.antwort).length;
  return [
    {ok:unbelegt===0,warn:unbelegt>0,t:unbelegt?`${unbelegt} Sachverhaltselement(e) ohne bestätigten Beleg`:'Jedes Sachverhaltselement belegt'},
    {ok:beantw===f.vorbringen.length,warn:beantw>0,t:`Vorbringen beantwortet: ${beantw} von ${f.vorbringen.length}`},
    {ok:!!f.massnahme,t:f.massnahme?'Schwere und Massnahme bezeichnet':'Schwere und Massnahme noch offen'},
    {ok:f.massnahme==='verweis'||f.androhungBegr,warn:f.massnahme&&f.massnahme!=='verweis'&&!f.androhungBegr,t:f.massnahme&&f.massnahme!=='verweis'?(f.androhungBegr?'Abweichung vom Raster begründet':'Androhungsfrage nicht begründet'):'Androhungsfrage konsistent mit Raster'},
    {ok:true,t:'Gleichbehandlung: Muster und Urteile verglichen'},
    {ok:f.zweit,t:f.zweit?'Zweitperson hat gelesen':'Zweitperson ausstehend'},
  ];
}
function ready(){const c=checks(),n=c.filter(x=>x.ok).length;return el(`<div class="ready"><div class="eyebrow">Verfügungsreife</div><div class="top2"><b>${n} / ${c.length}</b><span class="muted" style="font-size:12px">${n===c.length?'unterschriftsreif':'noch nicht unterschriftsreif'}</span></div><ul>${c.map(x=>`<li class="${x.ok?'ok':x.warn?'warn':''}">${x.t}</li>`).join('')}</ul></div>`)}

// --- Verfahren (Enforcement): Dokument im Zentrum
function enforcement(m){
  const f=S.f;
  head(m,['Werkbank','Verfahren',FALL.id],FALL.titel,'Verfahrenstag 240 von 365. Der Sachverhalt wird einmal erfasst und speist Erwägungen, Dispositiv und später die Vernehmlassung. Rechts siehst du, was der Verfügung noch fehlt.',3,`<button class="btn ${f.tab==='sachverhalt'?'dark':''}" data-t="sachverhalt">Sachverhalt</button><button class="btn ${f.tab==='vorbringen'?'dark':''}" data-t="vorbringen">Vorbringen</button><button class="btn ${f.tab==='verfuegung'?'dark':''}" data-t="verfuegung">Verfügung</button>`);

      if(e.ki&&!e.conf){const a=el('<div class="row" style="grid-column:2"><button class="btn dark sm">Bestätigen</button><button class="btn sm">Verwerfen</button></div>');a.children[0].addEventListener('click',()=>{e.conf=true;log('Sachverhaltselement bestätigt '+e.d);render()});a.children[1].addEventListener('click',()=>{f.chrono.splice(f.chrono.indexOf(e),1);log('Vorschlag verworfen '+e.d);render()});n.appendChild(a)}
      fx.appendChild(n)});
    b.querySelector('#kiEx').addEventListener('click',()=>{f.kiAdded=true;KI_EV.forEach(e=>f.chrono.push({...e}));log('2 Ereignisse aus Stellungnahme extrahiert');render();aiMsg('Zwei Angaben aus der Stellungnahme als Vorschläge eingetragen. Die telefonische Mahnung 2023 ist bestritten und nur durch die Partei belegt; sie bleibt markiert, bis ein Beleg vorliegt. Die Massnahmen nach dem Rücktritt sind durch Beilage 3 belegt.',[{t:'Akte 22, Ziff. 4',k:'k3',pass:'«Ich habe den Verwaltungsrat im September 2023 <mark>telefonisch</mark> an die ausstehende Jahresrechnung erinnert.»'},{t:'Akte 22, Beilage 3',k:'k3',pass:'Checkliste Mandatsannahme, Version 1.0, in Kraft ab <mark>1. Oktober 2025</mark>.'}],{tag:'Extraktion'})});

    m.appendChild(b);
    m.appendChild(el('<div class="block bare"><dl class="kv"><dt>Untätigkeit Bergfink AG</dt><dd>rund 20 Monate bis zur ersten belegten Mahnung, rund 27 Monate bis zum Rücktritt</dd><dt>Vergleich</dt><dd>B-3664/2025: 29 und 38 Monate, Verweis nach Korrektur des Gerichts</dd><dt>Wiederherstellung vor Intervention</dt><dd>ja, Rücktritt 18.09.2025, Hinweis bei RAB 14.02.2026</dd></dl></div>'));

  function vorbringen(m){
    const b=el(`<div class="block"><div class="bh"><h3>Vorbringen der Partei</h3><span class="chip quiet">Akte 22</span><button class="btn dark sm" id="antw">Antworten entwerfen</button></div><div class="vgrid"><div class="vcol" id="c1"></div><div class="vcol" id="c2"></div></div></div>`);

      b.querySelector('#c2').appendChild(y)});
    b.querySelector('#antw').addEventListener('click',()=>{f.vorbringen.forEach(v=>v.antwort=ANT[v.id]);log('Antworten auf 5 Vorbringen entworfen');render();aiMsg('Fünf Antworten entworfen. P2 und P3 sind Rechtsfragen und gehören in E. 2, P1 und P5 in die Sachverhaltswürdigung, P4 in die Verhältnismässigkeit. Jede Antwort wird wörtlich Teil der Erwägungen; bitte lesen.',[{t:'BVGer B-3664/2025 vom 13. Mai 2026',p:'E. 7',k:'k0',pass:'Von einem erfahrenen Revisor kann erwartet werden, dass er säumige Revisionskunden in nachvollziehbarer Form <mark>frühzeitig und regelmässig mahnt</mark>, die erforderlichen Unterlagen einfordert und ansonsten das Mandat niederlegt.'},{t:'Art. 728b, 729b, 730c OR; Art. 15 Abs. 3, 17 RAG',k:'k0'},{t:'Akten 7, 22',k:'k3'}],{tag:'Gehör'})});

  function verfuegung(m){

    lay.querySelector('#fr').addEventListener('click',()=>{log('Fassung FR entworfen');aiMsg('Französische Fassung entworfen. Terminologie nach Fedlex: «expert-réviseur», «retrait de l’agrément», «avertissement écrit».',[{t:'LSR (RS 221.302), art. 17',k:'k0'}],{tag:'Übersetzung'})});
    const ph=t=>`<span class="ph">${t}</span>`;

      <h2>Erwägungen</h2>

// --- Wissen: Suche mit Facetten und Passagen
function wissen(m){
  const w=S.w;
  head(m,['Werkbank','Wissen'],'Wissen','Urteile, eigene Verfügungen und Normen in einer Suche. Jeder Treffer zeigt die tragende Passage und sagt, warum er passt.',w.quelle==='Eigene Verfügung'?3:0,'<button class="btn dark" id="newM">Musterverfügung erstellen</button>');
  const sb=el(`<div class="ksearch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="kq" value="${esc(w.q)}" placeholder="z.B. Entzug ohne Androhung, Gegenrecht, Nachschau, Gebühr …" aria-label="Suche"></div>`);
  sb.querySelector('input').addEventListener('input',e=>{w.q=e.target.value;renderRes()});
  m.appendChild(sb);
  const all=[...URTEILE,...MUSTER];
  const lay=el('<div class="klayout"><div class="facets"></div><div class="res" id="res"></div></div>');
  const fc=lay.querySelector('.facets');
  const facet=(title,key,vals)=>{const d=el(`<div class="facet"><h4>${title}</h4></div>`);['alle',...vals].forEach(v=>{const cnt=v==='alle'?all.length:all.filter(x=>x[key]===v).length;const l=el(`<label><input type="radio" name="${key}" ${w[key==='typ'?'typ':'quelle']===v?'checked':''}><span>${v}</span><span class="c">${cnt}</span></label>`);l.querySelector('input').addEventListener('change',()=>{w[key==='typ'?'typ':'quelle']=v;render()});d.appendChild(l)});return d};
  fc.appendChild(facet('Quelle','quelle',['Urteil','Eigene Verfügung']));
  fc.appendChild(facet('Thema','typ',[...new Set(all.map(x=>x.typ))]));
  m.appendChild(lay);
  function renderRes(){
    const q=w.q.toLowerCase().trim();const res=lay.querySelector('#res');res.innerHTML='';
    const hits=all.filter(x=>(w.typ==='alle'||x.typ===w.typ)&&(w.quelle==='alle'||x.quelle===w.quelle)&&(!q||(x.cite+' '+x.typ+' '+(x.fall||'')+' '+(x.lehre||'')+' '+x.pass.replace(/<[^>]+>/g,'')).toLowerCase().includes(q)||/androh/.test(q)&&/Androhung|androh/.test(x.pass+x.lehre)));
    res.appendChild(el(`<div class="muted" style="font-size:12px;padding:8px 0">${hits.length} Treffer${q?` für «${esc(w.q)}»`:''}</div>`));
    hits.forEach(x=>{const n=el(`<div class="hit"><div class="hm"><span class="chip ${x.quelle==='Urteil'?'ok':'crit'}">${x.quelle==='Urteil'?'Klasse 0':'Klasse 3'}</span><span>${x.quelle}</span><span>·</span><span>${x.typ}</span><span>·</span><span>${x.jahr}</span>${x.veraltet?'<span class="chip warn">durch B-3664/2025 überholt</span>':''}</div><div class="ht">${esc(x.cite)}${x.e?` <span class="muted" style="font-size:14px">${x.e}</span>`:''}</div><div class="hp">${x.pass}</div><div class="why">${x.quelle==='Urteil'?`RAB: ${esc(x.rab)} · Gericht: <b>${esc(x.gericht)}</b> · ${esc(x.lehre)}`:`Schwere ${x.schwere} · ${x.massnahme} · Androhung ${x.androhung} · ${x.ausgang}`}</div></div>`);
      n.addEventListener('click',()=>{w.sel=x.id;showSource({lbl:x.quelle,t:x.cite,meta:(x.e||'')+' · '+x.typ,pass:x.pass,k:x.quelle==='Urteil'?'k0':'k3',note:x.quelle==='Urteil'?'Volltext bei Opencaselaw, täglich aktualisiert.':'Eigene Verfügung, Klasse 3. Bausteine: '+x.bausteine.join(', ')})});
      res.appendChild(n)});
  }
  renderRes();
  m.querySelector('#newM').addEventListener('click',musterWizard);
  if(w.sel){const x=all.find(y=>y.id===w.sel);if(x)showSource({lbl:x.quelle,t:x.cite,meta:(x.e||'')+' · '+x.typ,pass:x.pass,k:x.quelle==='Urteil'?'k0':'k3'});w.sel=null}
}

    o.querySelector('#wOpen').addEventListener('click',()=>{S.f.massnahme=ma.startsWith('Verweis')?'verweis':ma.includes('24')?'entzug24':'entzug12';S.f.muster=mu[0]?.id||null;log('Musterverfügung erzeugt: '+typ+' / '+ma);o.remove();go('enforcement','verfuegung')})});
  $('#overlayRoot').appendChild(o);
}

  an.querySelector('#redBtn').addEventListener('click',()=>{S.r.show=!S.r.show;render()});
  an.querySelector('#redOk').addEventListener('click',()=>{log('Anonymisierung freigegeben');aiMsg('Anonymisierte Fassung freigegeben. Fallzusammenfassung für den Praxisbericht nach Art. 19 Abs. 1 RAG entworfen.',[{t:'Art. 19 Abs. 1 und 2 RAG',k:'k0'}],{tag:'erledigt',tagc:'ok'})});

  bg.querySelector('#bgBtn').addEventListener('click',()=>{log('BGÖ-Prüfung G-2026-04');aiMsg('Gefestigte Rechtsprechung: Die RAB informiert über Verfahren nur bei überwiegendem Interesse; das private Interesse an einem Zivilprozess genügt nicht, und das BGÖ gibt keinen Zugang zu Akten, die die RAB selbst nicht offenlegen darf. Entwurf einer abweisenden Verfügung liegt bereit.',[{t:'BVGer B-6115/2019 vom 16. Dezember 2020',p:'E. 3.8, 4.4–4.5',k:'k0',pass:'Es kann nicht sein, dass das Öffentlichkeitsgesetz einem Dritten Anspruch auf Einsicht in Verfahrensakten gibt, bezüglich derer es der <mark>Aufsichtsbehörde selbst untersagt ist</mark>, Informationen offenzulegen.'},{t:'Art. 19 Abs. 2 RAG; Art. 7 BGÖ',k:'k0'}],{tag:'Prüfung',gate:{id:'bgo',items:['Konsultation der betroffenen Dritten geprüft (Art. 11 BGÖ)','Entwurf gelesen'],label:'Zur Unterschrift',logmsg:'BGÖ-Verfügung weitergeleitet',done:'Weitergeleitet (Demo)',after:'Weitergeleitet.'}})});
  m.appendChild(bg);
  const fq=el('<div class="block"><div class="bh"><h3>FAQ und Rundschreiben</h3><span class="chip ok">Klasse 0</span></div><div class="list"></div></div>');
  [['FAQ «Vergleichbare ausländische Ausbildungen»','Gilt als Verwaltungsverordnung (BVGer B-433/2022, E. 6.4)','Prüfen: UK nach Ende des FZA-Übergangsregimes','warn'],['Rundschreiben 1/2010 Berichterstattung','Letzte Änderung 2021','aktuell','ok'],['Grundsätze zum Enforcement, 2. Aufl.','Neue Urteile zur Androhungsfrage 2026','Ergänzung vorschlagen','warn']].forEach(x=>fq.querySelector('.list').appendChild(el(`<div class="item"><div class="d"></div><div class="t">${x[0]}</div><div class="r"><span class="chip ${x[3]}">${x[2]}</span></div><div class="m">${x[1]}</div></div>`)));

}

// ---------- Palette, Hilfe, Protokoll, Fragen ----------
const CMDS=[['Heute','heute'],['Zulassung: tabellarische Prüfung','zulassung'],['Überprüfung: File Review','pruefung'],['Verfahren: Sachverhalt','enforcement','sachverhalt'],['Verfahren: Vorbringen','enforcement','vorbringen'],['Verfahren: Verfügung','enforcement','verfuegung'],['Wissen: Suche','wissen'],['Musterverfügung erstellen','wissen','wizard'],['Rechtsdienst','recht'],['Protokoll anzeigen','log'],['Wie es funktioniert','help']];
function palette(){
  if($('#pal'))return;
  const o=el('<div class="palette" id="pal"><div class="pw"><input id="palIn" placeholder="Suchen oder Befehl … (z.B. Verfügung, Androhung, Muster)" aria-label="Befehl"><div class="items" id="palItems"></div></div></div>');
  let sel=0,list=[];const items=o.querySelector('#palItems');
  const run=c=>{o.remove();if(c[1]==='log')showLog();else if(c[1]==='help')help();else if(c[2]==='wizard'){go('wissen');musterWizard()}else if(c[1]==='search'){S.w.q=c[3];go('wissen')}else go(c[1],c[2])};
  const draw=()=>{const q=o.querySelector('#palIn').value.toLowerCase();list=CMDS.filter(c=>c[0].toLowerCase().includes(q));if(q.length>2)list.push([`Im Wissen suchen: «${o.querySelector('#palIn').value}»`,'search',null,o.querySelector('#palIn').value]);items.innerHTML='';list.forEach((c,i)=>{const it=el(`<div class="it ${i===sel?'act':''}">${c[0]}<span class="mono">↵</span></div>`);it.addEventListener('click',()=>run(c));items.appendChild(it)})};
  draw();
  o.querySelector('#palIn').addEventListener('input',()=>{sel=0;draw()});
  o.querySelector('#palIn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,list.length-1);draw()}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw()}if(e.key==='Enter'&&list[sel])run(list[sel]);if(e.key==='Escape')o.remove()});
  o.addEventListener('click',e=>{if(e.target===o)o.remove()});
  $('#overlayRoot').appendChild(o);o.querySelector('#palIn').focus();
}
function help(){
  const o=el(`<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="eyebrow">Prototyp</div><h2>Wie die Werkbank funktioniert</h2>
    <p>Klickbarer Prototyp mit fiktiven Fällen. Echt sind nur die zitierten Urteile und Normen. Drei Prinzipien bestimmen die Oberfläche.</p>
    <div class="legend"><div><b>Tabellarische Prüfung</b>Dossiers als Zeilen, Prüffragen als Spalten. Jede Zelle hat eine Quelle, neue Fragen füllt der Assistent über alle Dossiers.</div><div><b>Dokument im Zentrum</b>Die Verfügung wächst als Blatt; nummerierte Quellen statt Chat. Rechts steht, was noch fehlt.</div><div><b>Wissen als Suche</b>Urteile und eigene Verfügungen in einer Suche mit Facetten und hervorgehobener Passage.</div><div><b>Datenklasse</b>Oben rechts: Klasse 0 bis 3 bestimmt, wo das Modell läuft. Klasse 2 und 3 nur auf Bundesinfrastruktur.</div></div>
    <h3>Rundgang</h3><p style="font-size:13.5px">Zulassung: Zelle anklicken, dann eine neue Spalte füllen lassen («Weiterbildung der letzten 3 Jahre nachgewiesen?»). Prüfung: Arbeitspapiere lesen, Hinweise verifizieren. Verfahren: Stellungnahme extrahieren, Antworten entwerfen, Massnahme wählen, Blatt lesen, Quellen anklicken. Wissen: «Androhung» suchen, Musterverfügung erstellen. ⌘K öffnet die Palette.</p>
    <div class="row"><button class="btn dark" id="closeHelp">Zur Werkbank</button></div></div></div>`);
  o.querySelector('#closeHelp').addEventListener('click',()=>o.remove());o.addEventListener('click',e=>{if(e.target===o)o.remove()});$('#overlayRoot').appendChild(o);
}
function showLog(){const o=el(`<div class="overlay" role="dialog"><div class="modal"><h2>Protokoll</h2><p class="muted">Jede Aktion des Assistenten und jede Freigabe, mit Zeit und Person. Gehört zu den Verfahrensakten.</p><div class="log">${S.log.length?S.log.map(l=>`<div>${esc(l)}</div>`).join(''):'<div>Noch keine Einträge.</div>'}</div><div class="row"><button class="btn" id="cl">Schliessen</button></div></div></div>`);o.querySelector('#cl').addEventListener('click',()=>o.remove());o.addEventListener('click',e=>{if(e.target===o)o.remove()});$('#overlayRoot').appendChild(o)}
function ask(){
  const v=$('#ask').value.trim();if(!v)return;$('#ask').value='';S.panel='assist';aiMsg(esc(v),[],{user:true});log('Frage: '+v.slice(0,60));
  const q=v.toLowerCase();
  setTimeout(()=>{
    if(/androh|entzug|verweis/.test(q))aiMsg('Bei erstmaligem Verstoss und selbst wiederhergestelltem Zustand ist der Entzug vorher anzudrohen; ohne Androhung hat das Gericht den Entzug in einen Verweis umgewandelt. Bei groben oder wiederholten Verstössen im Kernbereich wurde der Entzug ohne Androhung geschützt.',[{t:'Art. 17 Abs. 1 RAG',k:'k0'},{t:'BVGer B-3664/2025 vom 13. Mai 2026',p:'E. 9.3.3',k:'k0',pass:URTEILE[1].pass},{t:'BVGer B-1640/2021 vom 19. Dezember 2022',p:'E. 9.3',k:'k0',pass:URTEILE[3].pass}],{tag:'Antwort'});
    else if(/gebühr|kosten/.test(q))aiMsg('Überprüfungen werden nach Zeitaufwand mit Tagessatz 1 500 Franken verrechnet, übrige Verfügungen mit 250 Franken pro Stunde. Der Zeitaufschrieb muss Phasen und Leistungen zuordnen.',[{t:'Art. 21 RAG; Art. 39, 40 RAV',k:'k0'},{t:'BGer 9C_99/2024 vom 25. September 2024',p:'E. 6.4',k:'k0',pass:URTEILE[8].pass}],{tag:'Antwort'});
    else if(/ausland|uk|diplom|gegenrecht/.test(q))aiMsg('Ausländische Ausbildungen setzen Vergleichbarkeit, Staatsvertrag oder Gegenrecht und die Berechtigung zur Abschlussprüfung im Herkunftsstaat voraus.',[{t:'Art. 4 Abs. 2 lit. d RAG',k:'k0'},{t:'BGer 2C_346/2023 vom 5. August 2025',p:'E. 3.4',k:'k0',pass:URTEILE[7].pass}],{tag:'Antwort'});
    else if(/bgö|zugang|einsicht/.test(q))aiMsg('Über Verfahren informiert die RAB nur bei überwiegendem Interesse. Das BGÖ gibt keinen Zugang zu Akten, die die RAB selbst nicht offenlegen darf.',[{t:'Art. 19 Abs. 2 RAG',k:'k0'},{t:'BVGer B-6115/2019 vom 16. Dezember 2020',p:'E. 3.8',k:'k0'}],{tag:'Antwort'});
    else aiMsg('Dazu habe ich im Demo-Bestand keine belegte Antwort.',[],{tag:'Antwort',nocite:true});
  },500);
}
