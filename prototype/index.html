<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legeartis Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/legeartis.css">
</head>
<body>
<!--BODY-->
<a class="skip" href="#haupt">Zum Inhalt</a>
<header class="kopf" role="banner">
  <a class="marke" href="#start" data-go="start" aria-label="Legeartis, Startseite"><span class="marke-wort">Legeartis</span><span class="marke-tag">Prototyp</span></a>
  <form class="feld" id="feld" role="search" autocomplete="off">
    <label class="sr" for="q">Zitat, Stichwort oder Rechtsfrage</label>
    <input id="q" name="q" type="text" spellcheck="false" placeholder="BGE 129 III 335 E. 5.2 · Art. 333 Abs. 3 OR · 4C.316/2002 · oder eine Rechtsfrage" aria-describedby="deutung">
    <kbd class="taste" aria-hidden="true">/</kbd>
  </form>
  <nav class="haupt-nav" aria-label="Bereiche">
    <a href="#treffer" data-go="treffer">Suche</a>
    <a href="#norm" data-go="norm">Norm</a>
    <a href="#entscheid" data-go="entscheid">Entscheid</a>
    <a href="#frage" data-go="frage">Rechtsfrage</a>
    <a href="#recherche" data-go="recherche">Recherche</a>
    <a href="#mappen" data-go="mappen">Mappen<span class="zahl" id="mappen-zahl"></span></a>
  </nav>
  <div class="werkzeuge">
    <button type="button" data-act="palette" title="Befehle (Ctrl/Cmd+K)">Befehle <kbd>⌘K</kbd></button>
    <button type="button" data-act="thema" title="Hell/Dunkel (t)" aria-label="Hell- oder Dunkelmodus umschalten">Hell/Dunkel</button>
  </div>
  <p class="deutung" id="deutung" aria-live="polite"></p>
</header>
<div class="standzeile" id="stand" hidden></div>
<main id="haupt" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="schleier" id="schleier" hidden></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<!--/BODY-->
</body>
</html>
